<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — iMobile</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#e11d2e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css?v=202611191407" />
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <section class="login" data-login hidden>
    <form class="login__card cut" data-login-form>
      <span class="cut__notch"><span class="mode-chip" data-mode-chip>Demo</span></span>
      <a href="../index.html" class="brand">
        <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="10" fill="#e11d2e"/>
          <rect x="20" y="10" width="24" height="44" rx="5" fill="none" stroke="#fff" stroke-width="3.5"/>
          <circle cx="32" cy="22" r="2.8" fill="#fff"/><rect x="29.6" y="27.5" width="4.8" height="16" rx="1.5" fill="#fff"/>
          <rect x="28" y="14" width="8" height="1.8" rx="0.9" fill="#fff"/>
        </svg>
        <span>iMobile <em>Admin</em></span>
      </a>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage products, orders, messages and site content.</p>
      <label class="fld"><span>Email</span><input class="inp" name="email" type="email" autocomplete="username" required /></label>
      <label class="fld"><span>Password</span><input class="inp" name="password" type="password" autocomplete="current-password" required /></label>
      <p class="login__error" data-login-error hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Sign in</button>
      <p class="login__hint" data-demo-hint hidden></p>
    </form>
  </section>

  <!-- ============ APP ============ -->
  <div class="app" data-app hidden>
    <!-- top bar (desktop) -->
    <header class="topbar">
      <a href="#/overview" class="brand">
        <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="10" fill="#e11d2e"/>
          <rect x="20" y="10" width="24" height="44" rx="5" fill="none" stroke="#fff" stroke-width="3.5"/>
          <circle cx="32" cy="22" r="2.8" fill="#fff"/><rect x="29.6" y="27.5" width="4.8" height="16" rx="1.5" fill="#fff"/>
          <rect x="28" y="14" width="8" height="1.8" rx="0.9" fill="#fff"/>
        </svg>
        <span class="brand__txt"><b>iMobile</b><small>Store admin</small></span>
      </a>
      <nav class="topnav" data-top-nav aria-label="Dashboard"></nav>
      <div class="topbar__right">
        <span class="conn-chip" data-conn-chip></span>
        <a href="#/inbox" class="iconbtn" aria-label="Inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l1 8v6H4v-6z"/></svg><span class="dot" data-top-dot hidden></span></a>
        <a href="../index.html" target="_blank" rel="noopener" class="iconbtn hide-md" aria-label="View store"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
        <a href="#/settings" class="iconbtn hide-md" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></a>
        <span class="user" data-user></span>
        <button type="button" class="iconbtn top__menu" data-menu aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      </div>
    </header>

    <!-- drawer (tablet / phone) -->
    <aside class="side" data-side>
      <a href="#/overview" class="brand"><svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="10" fill="#e11d2e"/>
          <rect x="20" y="10" width="24" height="44" rx="5" fill="none" stroke="#fff" stroke-width="3.5"/>
          <circle cx="32" cy="22" r="2.8" fill="#fff"/><rect x="29.6" y="27.5" width="4.8" height="16" rx="1.5" fill="#fff"/>
          <rect x="28" y="14" width="8" height="1.8" rx="0.9" fill="#fff"/>
        </svg><span class="brand__txt"><b>iMobile</b><small>Store admin</small></span></a>
      <nav class="side__nav" data-side-nav></nav>
      <div class="side__foot">
        <div class="conn" data-conn></div>
        <a href="../index.html" target="_blank" rel="noopener" class="side__link">View store ↗</a>
        <button type="button" class="side__link" data-signout>Sign out</button>
      </div>
    </aside>
    <div class="scrim" data-scrim></div>

    <main class="main">
      <div class="pagehead">
        <a href="#/overview" class="iconbtn pagehead__back" data-back-btn aria-label="Back to overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
        <div>
          <p class="top__crumb" data-crumb>Dashboard</p>
          <h1 class="pagehead__title" data-title>Overview</h1>
          <p class="pagehead__sub" data-sub></p>
        </div>
        <div class="pagehead__actions" data-actions></div>
      </div>
      <section class="view" data-view aria-live="polite"></section>
    </main>
  </div>

  <div class="toasts" data-toasts></div>
  <div data-modal-root></div>

  <script src="../config.js?v=202611191407"></script>
  <script src="../data.js?v=202611191407"></script>
  <script src="../store.js?v=202611191407"></script>
  <script src="admin.js?v=202611191407"></script>
</body>
</html>
